<!DOCTYPE html>
<!-- Source for public/assets/social-card.jpg (1200x630, the size link
     previews use). Not deployed. Render with `make social`. The canvas is a
     fixed size, so there is nothing responsive to author here. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://startr.style/style.css">
    <style>html, body { margin: 0; }</style>
  </head>
  <body style="
    --d:flex; --ai:center; --jc:center;
    --w:1200px; --h:630px; --m:0;
    --bgc:#1b1233;
    --bgi:url('https://image.startr.cloud/static/cache/nature_001_1200x800.jpg');
    --bgs:cover; --bgp:center;
  ">
    <div style="
      --d:flex; --ai:center; --g:52px;
      --p:56px 68px; --maxw:1020px;
      --bgc:rgba(255, 255, 255, 0.88); --radius:32px; --shadow:4;
    ">
      <span style="
        --d:block; --w:220px; --h:220px; --fs:0;
        --radius:50%; --of:hidden; --oe:white solid 10px; --shadow:18;
      ">
        <img src="../public/assets/startr-logo.png" width="220" height="220" alt=""
          style="--d:block; --t:scale(1.18);">
      </span>
      <div>
        <h1 style="--size:92px; --weight:800; --lh:1; --m:0; --c:oklch(0.0 0.0 0.0);">Startr LLC</h1>
        <p style="--size:36px; --lh:1.3; --m:22px 0 0; --c:oklch(0.0 0.0 0.25);">
          The company behind Sage.is<br>and Sage.Education
        </p>
        <p style="--size:30px; --weight:700; --m:26px 0 0; --c:oklch(0.35 0.12 300);">startr.llc</p>
      </div>
    </div>
  </body>
</html>
